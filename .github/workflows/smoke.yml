name: Smoke

# Runs against a QA or staging URL. Triggered on push and pull requests to main, by the app repo after a deploy, or by manual trigger with a URL .
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [staging-deployed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL (must be a QA, staging or preview host)"
        required: false
        default: ""

# A newer run for the same branch cancels the older one.
concurrency:
  group: smoke-${{ github.event.client_payload.branch || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      QA_BASE_URL: ${{ github.event.client_payload.url || github.event.inputs.base_url || vars.QA_BASE_URL || 'https://app.qa.nesto.ca' }}
      UI_RETRIES: "1"
      CI: "true"
      SKIP_KNOWN_BUGS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Check target is not production
        run: node scripts/check-target.js "$QA_BASE_URL"

      # Push and pull request: skip tests that create real accounts (cleanup is not available yet),
      # except @pr-smoke (the E2E signup, one account per language). Deploy and manual runs run everything.
      - name: Smoke tests (push / pull request)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          REPORT_DIR: blocking
        run: npx playwright test -c config/playwright.config.ts --project=api --project=chromium-en --project=chromium-fr --grep @smoke --grep-invert "^(?!.*@pr-smoke).*@creates-account"

      - name: Smoke tests (deploy / manual)
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        env:
          REPORT_DIR: blocking
        run: npx playwright test -c config/playwright.config.ts --project=api --project=chromium-en --project=chromium-fr --grep @smoke

      - name: Job summary
        if: always()
        run: node scripts/summary.js "Smoke (Chrome)" reports/blocking/results.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/
          retention-days: 14
